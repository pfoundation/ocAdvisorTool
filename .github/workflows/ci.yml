name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match local dev; bump together with bun.lock.
          bun-version: 1.3.8

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run typecheck

      - run: bun run build

      # Re-run after the build so dist-dependent package tests execute.
      - run: bun test

      - name: Verify build entrypoint
        run: >
          bun -e 'const root = Bun.resolveSync("./index", ".");
          const shim = (await import(root)).default;
          const compiled = (await import("./dist/index.js")).default;
          if (shim.id !== "oc-advisor" || typeof shim.setup !== "function" || "server" in shim) throw new Error("bad root shim entrypoint");
          if (compiled.id !== "oc-advisor" || typeof compiled.setup !== "function" || "server" in compiled) throw new Error("bad compiled entrypoint");
          if (!(await Bun.file("./dist/cli.js").exists())) throw new Error("missing dist/cli.js");
          const text = await Bun.file("./dist/cli.js").text();
          if (!text.startsWith("#!/usr/bin/env bun\n")) throw new Error("dist/cli.js is not a bun executable");
          console.log("entrypoint OK:", shim.id, "via", root);'

      - name: Verify tarball contents
        run: >
          npm pack --dry-run --json > /tmp/pack.json &&
          bun -e 'const pack = (await Bun.file("/tmp/pack.json").json())[0];
          const bad = pack.files.filter((f) => !/^(package\.json|README\.md|LICENSE|dist\/)/.test(f.path) || /test|usageReport/i.test(f.path));
          if (bad.length > 0) { console.error("unexpected files:", bad); process.exit(1); }
          for (const required of ["dist/cli.js", "dist/data/artificialAnalysis.mappings.json"]) {
            if (!pack.files.some((f) => f.path === required)) { console.error("missing packaged file:", required); process.exit(1); }
          }
          console.log("pack OK:", pack.files.length, "files");'
