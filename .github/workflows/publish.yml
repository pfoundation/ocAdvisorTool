name: Publish

on:
  release:
    types: [published]

run-name: Publish ${{ github.event.release.tag_name }}

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # GitHub-hosted runners only: OIDC + provenance require them
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match local dev; bump together with bun.lock.
          bun-version: 1.3.8

      # registry-url is required for npm OIDC trusted publishing (per npm
      # docs and the working oc2Usage setup); no NODE_AUTH_TOKEN is set, so
      # `npm publish` authenticates via the OIDC token exchange.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports trusted publishing
        run: |
          [ "$(printf '%s\n%s' "11.5.1" "$(npm --version)" | sort -V | head -n1)" = "11.5.1" ] \
            || { echo "npm $(npm --version) < 11.5.1; trusted publishing unavailable"; exit 1; }

      - run: bun install --frozen-lockfile

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          release="$(bun scripts/releaseVersion.ts)"
          eval "$release"
          [ -n "$VERSION" ] && [ -n "$DIST_TAG" ] || { echo "release resolution failed"; exit 1; }
          npm pkg set version="$VERSION"
          {
            echo "VERSION=$VERSION"
            echo "DIST_TAG=$DIST_TAG"
          } >> "$GITHUB_ENV"
          echo "publishing $(node -p "require('./package.json').version") from $RELEASE_TAG (prerelease: $PRERELEASE) with dist-tag $DIST_TAG"

      - run: bun test

      - run: bun run typecheck

      - run: bun run build

      - name: Verify build entrypoint
        run: >
          bun -e 'const p = await import("./dist/index.js");
          if (p.default.id !== "oc-advisor" || typeof p.default.setup !== "function" || "server" in p.default) throw new Error("bad entrypoint");
          console.log("entrypoint OK:", p.default.id);'

      - name: Verify tarball contents
        run: >
          npm pack --dry-run --json > /tmp/pack.json &&
          bun -e 'const pack = (await Bun.file("/tmp/pack.json").json())[0];
          const version = process.env.VERSION;
          if (pack.version !== version) throw new Error(`pack version ${pack.version} != ${version}`);
          const bad = pack.files.filter((f) => !/^(package\.json|README\.md|LICENSE|dist\/)/.test(f.path) || /test|usageReport/i.test(f.path));
          if (bad.length > 0) { console.error("unexpected files:", bad); process.exit(1); }
          console.log("pack OK:", pack.name + "@" + pack.version, pack.files.length, "files");'

      # auth is OIDC via the trusted publisher configured on npmjs.com (org
      # pfoundation, repo ocAdvisorTool, workflow publish.yml); setup-node's
      # registry-url is still needed so the npm CLI targets the public registry
      # before exchanging the OIDC token.
      - name: Publish to npm via OIDC trusted publishing
        run: npm publish --access public --tag "$DIST_TAG"
